# nf-core/rnaseq — Himes et al. 2014 (GSE52778)
# Human airway smooth muscle cells: dexamethasone vs untreated
# 4 samples (2 donors × 2 conditions)

input:  "data/samplesheet.csv"
outdir: "results/himes"

# Reference — GRCh38 via nf-core iGenomes (pre-built STAR index, no local download needed)
genome: GRCh38

# Alignment
aligner: star_salmon

# Trimming
trimmer: trimgalore
min_trimmed_reads: 10000

# QC
skip_dupradar: true
skip_deseq2_qc: false
